name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BIZATLAS_ENV: test
      BIZATLAS_INTEGRITY_SECRET: ${{ secrets.BIZATLAS_INTEGRITY_SECRET || 'ci-dev-secret-do-not-use-in-prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage gate
        run: |
          pytest --cov=bizatlas --cov-report=term-missing --cov-fail-under=75 -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
