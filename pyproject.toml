[project]
name = "bizatlas"
version = "0.1.0"
description = "商舆 BizAtlas — enterprise research & risk agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
# Temporal 编排底座（可选）：仅启用 Worker / 走 Temporal 编排时才需安装。
# 不计入核心依赖，避免离线 CI 因 PyPI 不可达而失败。
temporal = [
  "temporalio>=1.6.0",
]

[project.scripts]
bizatlas-api = "apps.api.launcher:main"
bizatlas-worker = "bizatlas.temporal.worker:run"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["bizatlas*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps"]

# Temporal 编排层（client / worker / activities / workflows）依赖可选依赖 temporalio
# 与一个真实 Temporal server，CI 不安装也不启动，无法在覆盖率门禁中体现；
# 故从统计中排除，其行为由 tests/test_temporal.py 单独验证
# （纯逻辑测试离线可跑；端到端集成测试在 TEMPORAL_SERVER=1 时运行）。
[tool.coverage.run]
omit = [
  "*/bizatlas/temporal/client.py",
  "*/bizatlas/temporal/worker.py",
  "*/bizatlas/temporal/activities.py",
  "*/bizatlas/temporal/workflows/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
