[project]
name = "bizatlas"
version = "0.1.0"
description = "企研通 BizAtlas — enterprise research & risk agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
bizatlas-api = "bizatlas_api_launcher:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["bizatlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"
