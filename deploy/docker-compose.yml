# BizAtlas 私有化一键部署（P0-② 最小合规）
# 用法：
#   cp .env.example .env && 编辑填密钥
#   ./privatize.sh            # 生成 AUTH_SECRET/BOOTSTRAP_TOKEN（若未设）
#   docker compose up -d
services:
  bizatlas:
    build: .
    container_name: bizatlas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 私有化默认开启鉴权（最小权限）
      BIZATLAS_AUTH_DISABLED: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/opt/bizatlas/data
      - ./uploads:/opt/bizatlas/uploads
      - ./exports:/opt/bizatlas/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
