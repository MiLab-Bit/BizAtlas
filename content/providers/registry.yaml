# BizAtlas 数据源注册表（占位）
# 配密钥时：改 enabled / 填 .env 对应变量即可逐个点亮
# 实现落位：packages/bizatlas/data/providers_<id>.py（活跃实现，读取本表 + 环境变量）

version: 1

providers:
  # ---------- P0：始终可用 / 本地 ----------
  - id: upload
    name: 用户上传解析
    tier: L1
    enabled: true          # 主源，勿关
    needs_key: false
    env: []
    serves: [financial, operating, documents]
    status: ready          # ready | stub | disabled

  - id: fixture
    name: 演示案例 Fixtures
    tier: L2
    enabled: true
    needs_key: false
    env: []
    serves: [financial, judicial, related, sentiment]
    status: ready

  - id: industry_static
    name: 静态行业参数
    tier: L3
    enabled: true
    needs_key: false
    env: []
    serves: [industry]
    status: ready          # content/industry/benchmarks.yaml

  # ---------- P0：财务 API（逐个配）----------
  - id: akshare
    name: AKShare 财务
    tier: L1
    enabled: true
    needs_key: false
    env: []
    serves: [financial, industry]
    status: ready
    notes: 已实现并安装（akshare 1.18）；实测通过

  - id: tushare
    name: Tushare Pro 财务
    tier: L1
    enabled: true
    needs_key: true
    env: [TUSHARE_TOKEN]
    serves: [financial]
    status: ready
    notes: 已实现（fina_indicator 需 500 积分；免费 token 自动降级 daily 行情）

  # ---------- P1：工商司法（二选一主用）----------
  - id: tianyancha
    name: 天眼查
    tier: L1
    enabled: true
    needs_key: true
    env: [TIANYANCHA_TOKEN]
    serves: [company_basic, judicial, related]
    status: ready
    notes: 背调主源；与 qichacha 只启用一个

  - id: qichacha
    name: 企查查
    tier: L1
    enabled: false
    needs_key: true
    env: [QICHACHA_TOKEN, QICHACHA_SECRET]
    serves: [company_basic, judicial, related]
    status: ready
    notes: 已实现（需 appkey+appsecret 签名）；registry 关闭，单源策略主用天眼查

  - id: company_json_import
    name: 工商司法 JSON 导入
    tier: L2
    enabled: true
    needs_key: false
    env: []
    serves: [company_basic, judicial, related]
    status: ready
    notes: 已实现（读 COMPANY_JSON_DIR 下 <key>.json，灵活字段映射）；无商业 Key 时兜底

  # ---------- P1：公告 ----------
  - id: cninfo
    name: 巨潮公告
    tier: L1
    enabled: true
    needs_key: false
    env: []
    serves: [announcements]
    status: ready
    notes: 已实现（免费）；端点 /new/hisAnnouncement/query + 沪深京 szse_stock.json 取 orgId，实测沪/深/创业板均可用

  # ---------- P2：舆情 ----------
  - id: news_akshare
    name: 新闻舆情（AKShare 通道）
    tier: L1
    enabled: true
    needs_key: false
    env: []
    serves: [sentiment]
    status: ready
    notes: 已实现（ak.stock_news_em）；实测通过

# 字段解析优先级（高 → 低）；未启用的自动跳过
resolve_order:
  financial: [upload, tushare, akshare, fixture, industry_static]
  judicial: [tianyancha, qichacha, company_json_import, fixture]
  related: [tianyancha, qichacha, company_json_import, fixture]
  industry: [industry_static, akshare, fixture]
  sentiment: [news_akshare, fixture]
  announcements: [cninfo, upload, fixture]
