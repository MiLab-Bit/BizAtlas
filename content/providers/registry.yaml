version: 1
# 数据源注册表：声明 BizAtlas 接入的外部数据/模型源。
# compliance/statement.py 会把本声明与运行时实际启用状态对账，
# 差异（running_not_declared / declared_not_running）会显式暴露，
# 声明即事实，不允许「文档写一套、系统跑另一套」。
providers:
  - id: qichacha
    name: 企查查开放平台
    enabled: true
    status: ready
    needs_key: true
    env: [QICHACHA_TOKEN, QICHACHA_SECRET]
    authorization: "需企查查开放平台 appkey+appsecret（企业与用户授权）"
    contains_personal_info: false

  - id: tianyancha
    name: 天眼查开放API
    enabled: true
    status: ready
    needs_key: true
    env: [TIANYANCHA_TOKEN]
    authorization: "需天眼查开放API token（企业与用户授权）"
    contains_personal_info: false

  - id: tushare
    name: TuShare Pro
    enabled: true
    status: ready
    needs_key: true
    env: [TUSHARE_TOKEN]
    authorization: "需 TuShare Pro token（行情/基本面，聚合公开数据）"
    contains_personal_info: false

  - id: akshare_news
    name: AkShare 新闻
    enabled: true
    status: ready
    needs_key: false
    env: []
    authorization: "聚合公开财经新闻，无需密钥"
    contains_personal_info: false

  - id: cninfo
    name: 巨潮资讯（公告）
    enabled: true
    status: ready
    needs_key: false
    env: []
    authorization: "聚合公开上市公司公告"
    contains_personal_info: false

  - id: credit_bureau
    name: 征信数据源（百行/朴道/央行征信前置）
    enabled: false
    status: stub
    needs_key: true
    env: [CREDIT_BUREAU_TOKEN]
    authorization: "需持牌征信机构授权与合规协议"
    contains_personal_info: true

  - id: invoice_ocr
    name: 票据/单证多模态 OCR
    enabled: false
    status: stub
    needs_key: false
    env: [VISION_API_KEY]
    authorization: "依赖视觉后端（vision_enabled + VISION_API_KEY）"
    contains_personal_info: false
  - id: upload
    name: 文件上传抽取（本地）
    enabled: true
    status: ready
    needs_key: false
    env: []
    authorization: "本地文件上传，不上外部源"
    contains_personal_info: false
